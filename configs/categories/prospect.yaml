category: prospect

fields:
  - name: name
    match_type: fuzzy
    required: true
    distractor_strategy: swap_similar_name
  - name: phone
    match_type: normalized_phone
    required: true
    distractor_strategy: perturb_digit
  - name: email
    match_type: exact
    required: true
    distractor_strategy: swap_domain
  - name: budget
    match_type: numeric_tolerance
    required: true
    distractor_strategy: perturb_amount
  - name: move_in_date
    match_type: date
    required: true
    distractor_strategy: shift_date
  - name: bedroom_type
    match_type: canonical_list
    required: true
    distractor_strategy: swap_sibling_value
    value_pool: bedroom_types
  - name: pet_info
    match_type: canonical_list
    required: false
    distractor_strategy: swap_sibling_value
    value_pool: pet_policies
  - name: parking_need
    match_type: canonical_list
    required: false
    distractor_strategy: swap_sibling_value
    value_pool: parking_types
  - name: tour_slot
    match_type: fuzzy
    required: false
    distractor_strategy: shift_window

scenarios:
  call_reasons:
    - new_inquiry
    - scheduling_tour
    - application_followup
    - lease_terms_question
    - availability_check
