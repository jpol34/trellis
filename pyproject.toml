[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trellis"
version = "0.1.0"
description = "Fine-tune of laya's choice classification head for closed-set field discrimination on property-management call transcripts, benchmarked against Jev and GPT-5.1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typesafe-sdk>=0.7",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
train = [
    "transformers>=4.46",
    "torch>=2.5",
    "accelerate>=1.0",
]
gen = [
    "faker>=30.0",
    "anthropic>=0.40",
    "openai>=1.50",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
trellis-pod-up = "trellis.pod.start_pod:main"
trellis-pod-down = "trellis.pod.stop_pod:main"
trellis-pod-status = "trellis.pod.status:main"
trellis-gen-training = "trellis.generation.build_training_corpus:main"
trellis-gen-eval = "trellis.generation.build_eval_set:main"
trellis-finetune = "trellis.finetune.train:main"
trellis-eval = "trellis.validate.run_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
